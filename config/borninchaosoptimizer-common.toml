#General, Global Events & Network Queue / 全局事件、网络包与延时队列优化
[general_and_events]
	#Fix BornInChaosV1Mod.workQueue memory leak on <=0 tick tasks, exception residue, O(N*M) removal, and cross-world retention / 修复全局延时队列 <=0 刻任务永久泄漏、异常中断残留、O(N*M) 移除及退出存档残留问题
	fixWorkQueueLeak = true
	#Optimize EntityAnimationFactory from 83 sequential instanceof checks per entity per tick to a single O(1) interface check / 将实体动画同步从全服每实体每刻 83 次顺序 instanceof 检查优化为单次 O(1) 接口分发
	optimizeEntityAnimationSync = true
	#Eliminate unconditional ItemStack.copy() and CompoundTag deep copies every player tick in ItemAnimationFactory / 消除玩家每刻无条件深拷贝主副手物品栈与 NBT 标签的开销
	optimizeItemAnimationSync = true
	#Replace global ServerScoreboard UUID score writes (Door Knight, Skeleton Thrasher, Thornshell Crab) with entity PersistentData to prevent scoreboard.dat bloat and packet spam / 将门骑士、碎骨骷髅、刺壳蟹对全局计分板的永久 UUID 写入替换为实体自身 NBT 状态，根除存档计分板膨胀与全服发包风暴
	fixScoreboardLeak = true
	#Clean up leftover dead-entity UUID entries under 'bloc', 'blocc', and 'eat' objectives on server start / 服务器启动时自动清理历史遗留在 bloc、blocc、eat 计分板项下的死实体 UUID 记录
	cleanLegacyScoreboardEntries = true
	#Prevent Cursed Mark and Undead Summon from prematurely spawning ambush mobs when cured by Totem or /effect clear / 修复诅咒印记与亡灵召唤被图腾或指令驱散时反而立即触发惩罚召唤的缺陷
	fixEffectRemovalPrematureTrigger = true
	#Fix Lord Pumpkinhead and Lord The Headless comparing boss health against victim max health instead of boss max health, and fix friendly buffing of enemy mobs / 修复南瓜领主与无头领主将自身生命与受击者最大生命对比导致二阶段技能失效及误给敌人加力量效果的缺陷
	fixBossPhaseHealthCheck = true
	#Fix NoClassDefFoundError crashes on dedicated servers when mining Black Argillite / Dark Metal Deposit / Rotten Soil or firing Pumpkin Pistol / Staff of Magic Arrows / 修复专用服务端挖掘黑泥岩、暗金属矿、腐壤或发射南瓜手枪与魔矢法杖时加载客户端类导致崩服的缺陷
	fixDedicatedServerClientCrash = true
	#Fix Krampus & Henchman spawning empty ItemEntities on bare-handed players and eliminate 41-slot inventory deep-copy loops / 修复坎卜斯及爪牙对空手玩家生成空掉落物、消除无意义的 41 格背包深拷贝循环并补全破盾上下文
	fixKrampusDisarmAndShield = true
	#Add reentrancy guard to retaliation damage procedures and avoid redundant registry lookups when Spiny Shell armor is not worn / 为反伤过程添加防重入保护避免死循环崩服，并消除未穿刺壳甲时的冗余附魔注册表查询
	fixThornsReentrantAndLookup = true
	#Prevent seasonal spawn handlers from re-rolling and overwriting mob equipment on every chunk reload, and cache Calendar lookups / 防止季节性刷怪事件在每次区块重载时重复判定并覆盖怪物已有装备，同时缓存日历查询
	fixSeasonalReloadOverwrite = true

#Entity AI, Pathfinding & Tick Optimizations / 生物 AI、寻路与每刻逻辑优化
[ai_and_entities]
	#Skip redundant refreshDimensions() calls every tick on entities whose getDefaultDimensions uses a constant scale / 跳过恒定尺寸生物在 baseTick 中每刻无意义调用的 refreshDimensions()（避免每刻双端触发 EntityEvent.Size 与碰撞箱重建）
	optimizeConstantEntityDimensions = true
	#Fix 1.21.1 double experience orb drop and client-side premature removal in MCreator entity tickDeath overrides / 修复 1.21.1 生物死亡时掉落双倍经验球以及客户端提前本地销毁实体的缺陷
	fixDoubleDeathExperience = true
	#Throttle expensive per-tick canSeeSkyFromBelowWater / block scans and redundant effect re-applications on entities / 优化生物每刻昂贵的水下天空视线扫描与重复施加同名药水效果的开销
	optimizeSkyAndSunburnChecks = true
	#Throttle excessive per-tick A* path recalculations on Scarlet Persecutor and flying spirits that cause 50-100ms server spikes / 限制猩红追猎者与飞行幽灵每刻高频重算三维 A* 寻路导致的 50-100ms 服务端卡顿尖峰
	optimizeFlyingPathfinding = true
	#Cap nearby Corpse Fly and Maggot density spawned by Rotten Smell / Myiasis /Infestation to prevent entity explosion lag / 限制腐臭、蝇蛆病等效果在局部区域无限繁殖尸蝇与蛆虫的密度上限，防止实体爆炸性堆积卡死客户端
	capSummonedPestDensity = true
	#Maximum number of Corpse Flies or Maggots allowed within 16 blocks before effect-based spawning pauses / 半径 16 格内允许通过药水效果继续滋生的尸蝇或蛆虫最大数量
	# Default: 24
	# Range: 4 ~ 256
	maxNearbyPestCount = 24
	#Server particle packet interval in ticks for Rotten Smell ambient flies (1 = every tick) / 腐臭效果服务端环境苍蝇粒子发包间隔刻数
	# Default: 4
	# Range: 1 ~ 40
	rottenSmellParticleInterval = 4
	#Guard custom Goal.tick() implementations against null or dead targets on odd server AI ticks, and throttle per-tick RangedAttackGoal repathing / 为自定义 AI Goal.tick() 增加目标判空与存活保护，防止奇数刻空指针崩服，并限制远程攻击目标每刻高频重算寻路
	fixCustomGoalNullTarget = true
	#Fix Lord Pumpkinhead and Sir Pumpkinhead hit-teleport procedures checking wrong coordinates for snow and unconditionally teleporting into solid walls on the Z- fallback branch / 修复南瓜领主与南瓜爵士受击瞬移时坐标写反及兜底分支不检查方块阻挡直接瞬移进实心墙体窒息的缺陷
	fixBossTeleportIntoWalls = true
	#Fix Mother Spider and Nightmare Stalker triggering on-hurt summons/rage before immunity & super.hurt checks, and fix Mother Spider's second baby spider particle coordinate / 修复母蜘蛛与梦魇潜行者在摔落/箭矢免疫及无敌帧判定前误触发受击召唤与怒气累加，并修正母蜘蛛第二只幼蛛粒子坐标
	fixEntityHurtOrderAndSummonParticle = true
	#Prevent same-tick duplicate Boss phase spawns (Lifestealer, Supreme Bonescaller, Lord/Sir Pumpkinhead, Phantom Creeper) and fix Controlled Baby Skeleton / Mr. Pumpkin respawning after expiration / 修复首领转阶段与幻影苦力怕同刻多段伤害刷出双倍首领，以及受控幼年骷髅与受控南瓜先生抗性到期消失后原地无限重生的缺陷
	fixBossAndMinionDuplicateSpawn = true
	#Cap nearby summoned minion and swarm entity density from Swarmer, Mother Spider, Bonescaller, Spirit Guide, and Undead Summon to prevent runaway entity flooding / 限制虫群宿主、母蜘蛛、唤骨者、灵魂向导、亡灵召唤等高频衍生召唤的局部同类实体密度上限，防止无限堆怪卡服
	capMinionAndSwarmSpawning = true
	#Maximum alive entities of the same summoned type allowed within minionCapRadius before pausing extra spawns / 检测半径内允许存在的同类衍生实体最大数量上限（默认 24，不影响正常战斗）
	# Default: 24
	# Range: 4 ~ 128
	maxNearbySummonedMinions = 24
	#Radius in blocks to count nearby summoned minions/swarms / 衍生实体密度统计半径（格）
	# Default: 24
	# Range: 8 ~ 64
	minionCapRadius = 24
	#Allow wild naturally spawned Thornshell Crabs to despawn when far away so they do not permanently clog the 10-slot CREATURE cap; fed, bred, named, or leashed crabs remain persistent / 修复野生刺壳蟹自然刷新却永久不消失导致长期占满 CREATURE（10 只）动物上限的缺陷；被玩家喂食、繁殖、命名或拴绳的刺壳蟹仍永久保留
	allowWildThornshellCrabDespawn = true
	#Block Corpse Fish and Glutton Fish from spawning in Peaceful difficulty and restore Thornshell Crab's biome & gamerule spawn predicate lost in 1.21.1 / 修复腐尸鱼与暴食鱼在和平难度下反复刷出并瞬消的空转，并恢复 1.21.1 遗失的刺壳蟹河岸群系与游戏规则刷新条件
	fixSpawnConditions = true

#Mob Effects Optimizations / 药水效果优化与缺陷修复
[mob_effects]
	#Replace per-tick '/execute as @e[type=item...]' command parsing in Lost Items effect with direct AABB ItemEntity lookup / 将丢失物品效果每刻执行的原版命令解析替换为原生范围 ItemEntity API，彻底消除命令解析器开销
	replaceLostItemsCommandWithApi = true
	#Optimize expensive AABB entity scans and redundant allocations in MobEffect tick procedures / 优化药水效果每刻过程中的大范围实体扫描与冗余排序分配
	optimizeEffectTickScans = true

#Client Rendering & Allocation Caches / 客户端渲染管线与对象缓存优化
[client_rendering]
	#Cache ResourceLocation and SoundEvent lookups in GeoModels and entity sound methods instead of parsing strings every frame/step / 缓存 GeoModel 模型/贴图/动画路径与实体音效查找，消除每帧每步重复字符串解析分配
	cacheResourceLocationsAndSounds = true
	#Cache baked HumanoidModel instances for Born in Chaos custom armors instead of calling bakeLayer() multiple times every render frame / 缓存生于混沌自定义 3D 盔甲烘焙模型，消除每渲染帧重复调用多次 bakeLayer() 重建网格的巨额开销
	cacheCustomArmorModels = true
	#Reuse immutable RawAnimation constants in GeckoLib predicates instead of allocating new RawAnimation builders every frame / 复用预构建的 RawAnimation 实例，消除每渲染帧在动画谓词中重复分配动画构建器的开销
	cacheRawAnimations = true
	#Cache RenderType instances in GeoRenderLayers and entity renderers to reduce RenderType state churn and per-frame allocations while preserving all visual effects / 缓存发光层与实体渲染器的 RenderType 实例，在完全保留原有发光与半透明视觉表现的前提下降低每帧渲染状态开销
	optimizeGlowLayersAndRenderTypes = true
	#Automatically use entityCutoutNoCull for non-translucent entity and 3D item textures while preserving entityTranslucent for semi-transparent spirits/wings / 自动检测贴图半透明像素：对纯不透明/二值镂空贴图使用 entityCutoutNoCull 以消除每帧 CPU 面片深度排序与肢体穿模，同时完整保留半透明生物表现
	optimizeOpaqueEntityRenderTypes = true

#Items, Blocks & Projectiles Fixes / 物品、方块与弹射物缺陷修复
[items_and_blocks]
	#Pass proper LivingEntity & EquipmentSlot context to hurtAndBreak so Creative players do not lose durability and item break sounds/particles work properly / 为物品耐久扣减补全持有者与槽位上下文，修复创造模式误扣耐久及武器盾牌碎裂无音效粒子的缺陷
	fixEquipmentDurabilityContext = true
	#Fix Nut Hammer enchanted helmet duplication, infinite mob helmet duplication without ItemHandler, and empty ItemEntity drops on bare-headed targets / 修复坚果锤击落附魔头盔刷物品漏洞、无容器能力生物无限刷头盔及对无头盔目标掉落空物品的缺陷
	fixNutHammerDisarm = true
	#Fix single-stack consumables applying cooldown to Items.AIR after shrink(1), prevent Creative item consumption, and preserve stacked Fel Lamps / 修复消耗品单格使用时先扣数量导致将空气加入冷却（0冷却无限连点）、创造模式误扣消耗品及魔灯堆叠覆盖丢失的缺陷
	fixConsumableCreativeAndCooldown = true
	#Prevent Hound Trap & Frostbitten Blade AOE from destroying dropped items/frames, fix Spiny Shell Trap fly immunity tautology, and fix Intoxicating Bomb per-entity particle multiplication / 修复捕兽夹与霜噬之刃范围技能误毁地面掉落物与展示框、刺壳陷阱逻辑恒真误伤飞虫及迷醉炸弹按实体数倍增粒子的缺陷
	fixTrapAndAoeNonLivingDamage = true
	#Eliminate redundant per-tick sendBlockUpdated NBT packets and client chunk re-renders on Dark Ice, Destructible Fel Soil, and Puddle blocks / 消除暗冰、可毁邪土、刺激水洼与迷醉水洼每刻无意义触发的整块 NBT 同步包与客户端区块重建风暴
	optimizeTemporaryBlockEntitySync = true
	#Scheduled tick step interval for Dark Ice, Destructible Fel Soil, and Puddle blocks (total duration remains unchanged) / 暗冰、可毁邪土与药水水洼的倒计时合并调度步长（总持续时长保持不变）
	# Default: 5
	# Range: 1 ~ 20
	temporaryBlockTickInterval = 5
	#Optimize per-tick AABB entity scans on summoner staffs/hats and throttle redundant 10-30 tick effect packet spam on equipped armor & weapons / 优化召唤法杖与帽子在背包内每刻双端实体扫描，并节流盔甲武器每刻重复刷新短时药水导致的发包风暴
	optimizeEquipmentInventoryTicks = true
	#Guard PlayerAdvancements.getOrStartProgress against null AdvancementHolders when modpacks disable advancements via datapack / 防止整合包通过数据包移除进度后穿戴暗金属套、梦魇斗篷或触发进度检查时发生空指针崩服
	fixMissingAdvancementNullCrash = true
	#Disallow player ground/deflect pickup on all 14 Born in Chaos AbstractArrow projectiles to prevent free Spiritual Dust / bomb duplication / 禁止玩家贴身或盾反拾取全部 14 种生于混沌弹射物，防止白嫖灵尘、炸弹与复活节彩蛋刷物品
	fixProjectilePickupDupe = true
	#Replace permanent 1-2 tick self-scheduling on Hound Trap, Closed Hound Trap, Spiny Shell Trap, and Cobweb Cover with neighborChanged-driven support checks / 将捕兽夹、闭合捕兽夹、刺壳陷阱与蛛网覆层的永久每 1~2 刻空转自调度优化为邻格更新驱动检测，使静置陷阱常驻服务端开销降为 0
	optimizeStaticTrapBlockTicks = true
	#Prevent client-side ghost block placements (Dark Ice, Fel Soil, Puddles), client desynced teleports, and fix Stimulation Splash particle loop multiplication / 拦截实体与弹射物在客户端生成未同步的幽灵暗冰/邪土/水洼与本地瞬移拉扯，并修复刺激药水瓶空地无粒子、怪堆千粒掉帧缺陷
	fixClientSideGhostMutations = true
	#Replace hardcoded AxeItem/PickaxeItem instanceof checks in shield breaking, scorched wood stripping, and black argillite mining with standard vanilla item tags and NeoForge ItemAbilities / 将破盾、焦木去皮与黑泥岩挖掘中的硬编码工具类检查替换为原版标准标签与 NeoForge ItemAbilities
	fixHardcodedToolChecks = true
	#Handle Dark Ward and Death Totem at HIGH event priority for revive-mod compatibility, skip void and /kill bypass damage, protect Creative stacks, and unify hand buffs / 以 HIGH 事件优先级统一处理暗影守护与死亡图腾免死以兼容倒地复活模组，修复掉虚空与 /kill 误消耗、创造模式误耗及主副手力量等级不一致缺陷
	fixDeathProtectionEvents = true
	#Send Nightmare Stalker and Missionary invasion warnings as translatable components instead of server-pre-flattened strings / 修复梦魇潜行者与传教士警告在服务端提前硬转字符串导致专用服务端输出原始翻译键及无法按客户端语言本地化的问题
	fixWarningMessageLocalization = true
