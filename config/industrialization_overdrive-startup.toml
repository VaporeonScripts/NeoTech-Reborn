#Whether upgrades should be allowed in the Multi Processing Array
allow_upgrades_in_multi_processing_array = true
#How many levels of Extended Industrialization Machine Chainers to copy; 0 disables copying and -1 is unlimited
# Default: -1
# Range: -1 ~ 1024
machine_chainer_copy_depth = -1

[batching_machines]
	#The multiplier to use for the EU cost of the Multi Processing Array
	# Default: 1.0
	# Range: 0.1 ~ 1.7976931348623157E308
	multi_processing_array_eu = 1.0

[me_hatches]
	#How many ticks newly placed ME hatches wait between transfers with the ME network; each hatch can change it in its screen. 1 transfers every tick
	# Default: 40
	# Range: 1 ~ 1200
	transfer_interval_ticks = 40
	#How many transfer intervals ME input hatches keep stocking for the last recipe after the multiblock stops running it, so a short stall does not return the stock to the network
	# Default: 3
	# Range: 0 ~ 100
	smart_pull_hold_intervals = 3
