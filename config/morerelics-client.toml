["Weaver's Spool"]
	#The corner which the silk bar is rendered at.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	silkBarCorner = "BOTTOM_RIGHT"

[Cyberpsychosis]
	#Disguises some passive and neutral mobs as hostile entities while the Cyberpsychosis effect is active.
	cyberpsychosisDisguiseEffect = true

["Wonder of U"]
	#The black and white + outline effect of nullification.
	nullificationVisualEffect = true

[General]
	#Renders some special effects from relics as icons above the food bar. This does not include SwiftEdge and RunicPlate icons.
	specialEffectIcons = true

[Swiftedge]
	#Renders sword icons above the food bar to show current stacks.
	swiftedgeStackIcons = true

["Runic Plate"]
	#Renders shield icons above the food bar to show current stacks.
	runicPlateStackIcons = true
