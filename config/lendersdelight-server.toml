[Stat]
	#Enable or disable stat effects.
	enableStat = true
	#Show stat in food tooltips.
	showStatTip = true
	#Reset player stats on death.
	resetOnDeath = false
	#ACCUBULATE=food can stats every time.
	#ONCE=each food can give only once per player.
	#LIMITED=food gives stats only Minecraft attribute is below configured limit.
	#CAPPED=each food grants its stat up to number of times per player, json capped overrides the default
	#Allowed Values: ACCUMULATE, ONCE, LIMITED, CAPPED
	statMode = "ACCUMULATE"
	#Default number of stat grant uses per food in CAPPED mode when JSON has no capped field
	# Default: 3
	# Range: 0 ~ 1000000
	cappedDefault = 3
	#Allow opening a player stats screen.
	showStatScreen = false
	#Apply accumulate Jump Boost stat only while a player has the Jump Boost effect
	jumpBootsEffect = false
	#Multiplier for new stat from food. Does not affect stored stats. Zero disable new food
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	statMultiplier = 1.0
	#Show actual stat gain in a action bar after eating
	showStatGain = false
	#Show remaining CAPPED use in food tooltips while hold Ctrl
	showStatUse = false

["Stat Limits"]
	#Maximum Armor attribute value
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	maxArmor = 20.0
	#Maximum Attack Damage attribute value
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	maxAttackDamage = 20.0
	#Maximum Movement Speed attribute value
	# Default: 0.2
	# Range: 0.0 ~ 10000.0
	maxMovementSpeed = 0.2
	#Maximum stored Jump Boost stat percent
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	maxJumpBoost = 20.0
	#Maximum Attack Speed attribute value
	# Default: 8.0
	# Range: 0.0 ~ 10000.0
	maxAttackSpeed = 8.0
	#Maximum stored Crit Chance stat percent
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	maxCritChance = 20.0
	#Maximum Knockback Resistance attribute value
	# Default: 0.5
	# Range: 0.0 ~ 10000.0
	maxKnockbackResistance = 0.5
	#Maximum Passive Regen stat percent
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	maxPassiveRegen = 20.0
	#Maximum Swim Speed attribute value
	# Default: 10.0
	# Range: 0.0 ~ 10000.0
	maxSwimSpeed = 10.0

#Disable stat are neither granted by food nor applied. Stored value are preserved
["Stat Type"]
	armorBoost = true
	attackDamage = true
	speedBoost = true
	jumpBoost = true
	attackSpeed = true
	critChance = true
	knockbackResistance = true
	passiveRegen = true
	swimSpeed = true
