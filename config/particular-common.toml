#Particular Mod Configuration
[general]

	#Enable/Disable Effects
	[general.enabledEffects]
		#Enable water splash particles
		waterSplash = true
		#Enable cascade particles
		cascades = true
		#Enable waterfall spray particles
		waterfallSpray = true
		#Enable firefly particles
		fireflies = false
		#Enable falling leaves particles
		fallingLeaves = true
		#Enable cave dust particles
		caveDust = true
		#Enable chest bubbles
		chestBubbles = true
		#Enable soul sand bubbles
		soulSandBubbles = true
		#Enable barrel bubbles
		barrelBubbles = true
		#Enable popping bubbles
		poppingBubbles = true
		#Enable rain ripples
		rainRipples = false
		#Enable water drip ripples
		waterDripRipples = true
		#Enable cake eating particles
		cakeEatingParticles = true
		#Enable emissive lava drips
		emissiveLavaDrips = true
		#Enable lava splash particles when entities hit lava
		lavaSplash = true
		#Enable water splash and wake particles for Sable sub-levels (ships, boats, vehicles)
		sableSplashes = true
		#Enable the translucent mist that drifts off cascades
		cascadeMist = true
		#Enable camera shake for loud nearby sounds such as explosions and Warden roars
		screenShake = true
		#Enable snow falling off leaves that have snow on top or while it is snowing
		leafSnow = true
		#Enable visible breath from players and mobs in cold places
		coldBreath = true
		#Enable dust kicked up when running or landing on loose ground such as sand, dirt, gravel and snow
		footstepDust = true
		#Enable pollen drifting off flowers during the day
		pollen = true
		#Enable spores drifting off moss and mushrooms
		spores = true
		#Enable glowing embers rising from campfires and spitting from lit furnaces
		embers = true
		#Enable bushes tumbling across dry sandy biomes
		tumbleweeds = true
		#Enable a rainbow in the sky after it stops raining during the day
		rainbows = true
		#Show a one-time chat message listing the effects added by an update when you open a world that existed before it
		updateNotice = false

	#Advanced Particle Settings
	[general.advancedSettings]

		[general.advancedSettings.fireflySettings]
			#Time when fireflies start spawning
			# Default: 12000
			# Range: 0 ~ 23999
			startTime = 12000
			#Time when fireflies stop spawning
			# Default: 23000
			# Range: 0 ~ 23999
			endTime = 23000
			#Minimum temperature for fireflies to spawn
			# Default: 0.5
			# Range: 0.0 ~ 2.0
			minTemp = 0.5
			#Maximum temperature for fireflies to spawn
			# Default: 0.9900000095367432
			# Range: 0.0 ~ 2.0
			maxTemp = 0.9900000095367432
			#Whether fireflies can spawn in rain
			canSpawnInRain = false
			#Biomes where fireflies always spawn (bypasses temperature check). Example: "minecraft:swamp"
			biomes = []
			#Extra blocks that spawn fireflies. Example: "tfc:plant/cattail"
			spawnBlocks = []
			#Per-biome firefly RGB hex tints. Format: "biomeId|RRGGBB". Example: "minecraft:swamp|FFD27F". Takes priority over fireflyColorPool.
			biomeColors = []
			#Random RGB hex colors picked per firefly when no biomeColors entry matches. Empty = use built-in yellow/blue/red mix. Format: "RRGGBB".
			colorPool = []

			[general.advancedSettings.fireflySettings.frequencyModifiers]
				#Daily random factors for firefly spawning
				dailyRandom = [0.0, 0.0, 0.0, 0.33, 0.66, 1.0]
				#Frequency modifier for grass
				# Default: 0.16666666666666666
				# Range: 0.0 ~ 1.0
				grass = 0.16666666666666666
				#Frequency modifier for tall grass
				# Default: 0.08333333333333333
				# Range: 0.0 ~ 1.0
				tallGrass = 0.08333333333333333
				#Frequency modifier for flowers
				# Default: 1.0
				# Range: 0.0 ~ 1.0
				flowers = 1.0
				#Frequency modifier for tall flowers
				# Default: 0.5
				# Range: 0.0 ~ 1.0
				tallFlowers = 0.5
				#Frequency modifier for blocks listed in fireflySpawnBlocks
				# Default: 0.16666666666666666
				# Range: 0.0 ~ 1.0
				customBlocks = 0.16666666666666666

		[general.advancedSettings.fallingLeavesSettings]
			#Chance of spawning falling leaves (higher = less frequent)
			# Default: 60
			# Range: > 1
			spawnChance = 95
			#Whether falling leaves create ripples when landing on water
			spawnRipples = true
			#Whether falling leaves lay flat on the ground
			layFlatOnGround = true
			#Whether falling leaves lay at right angles
			layFlatRightAngles = false

		[general.advancedSettings.caveDustSettings]
			#Chance of spawning cave dust (higher = less frequent)
			# Default: 700
			# Range: > 1
			spawnChance = 700
			#Base maximum age of cave dust particles
			# Default: 200
			# Range: > 1
			baseMaxAge = 200
			#Color of cave dust particles (RGB hex)
			# Default: 8421504
			# Range: 0 ~ 16777215
			color = 8421504
			#Duration of fade effect for cave dust particles
			# Default: 20
			# Range: > 0
			fadeDuration = 20
			#Maximum acceleration of cave dust particles
			# Default: 0.029999999329447746
			# Range: 0.0 ~ 1.0
			maxAcceleration = 0.029999999329447746
			#Chance of changing acceleration for cave dust particles
			# Default: 180
			# Range: > 1
			accelChangeChance = 180
			#Biomes where cave dust won't spawn
			excludeBiomes = ["minecraft:lush_caves", "minecraft:dripstone_caves", "minecraft:deep_dark"]

		[general.advancedSettings.waterSplashSettings]
			#Minimum fall distance (in blocks) required to trigger water splash particles
			# Default: 0.0
			# Range: 0.0 ~ 100.0
			minFallDistance = 0.0
			#Whether small splashes should emit water droplet particles
			smallDroplets = false
			#Opacity of water and lava splash particles
			# Default: 0.75
			# Range: 0.0 ~ 1.0
			splashOpacity = 0.75
			#Whether soft water entries should emit bubbles and tiny falling-water droplets instead of a full splash
			softEntryParticles = true
			#Use 1-voxel cuboid particles for waterfall spray
			cuboidWaterfallSpray = false
			#Use 1-voxel cuboid particles for splash droplets
			cuboidSplashDroplets = true
			#Tint cuboid waterfall spray using the local biome water color
			waterCuboidBiomeTint = true
			#Fallback color of cuboid waterfall spray when biome tinting is disabled (RGB hex)
			# Default: 16777215
			# Range: 0 ~ 16777215
			waterCuboidColor = 16777215
			#Color of cuboid lava droplets (RGB hex)
			# Default: 16738335
			# Range: 0 ~ 16777215
			lavaCuboidColor = 16738335

		[general.advancedSettings.customFluidsSettings]
			#Fluid IDs treated like vanilla water for splash, rain ripples, and waterfall spray. Example: "tfc:river_water"
			waterLikeFluids = ["tfc:river_water", "tfc:flowing_salt_water", "tfc:salt_water", "tfc:flowing_spring_water", "tfc:spring_water"]
			#Flowing,source fluid pairs that produce cascade waterfalls. Example: "mymod:flowing_water,mymod:water". TFC fluids do not produce cascades because they have no flowing variant.
			cascadeFluidPairs = []

		[general.advancedSettings.cascadeSettings]
			#Whether cascades get stronger the further the water falls
			heightScaling = true
			#Cascade intensity for a 1 block fall (1.0 = normal)
			# Default: 0.4
			# Range: 0.0 ~ 5.0
			minIntensity = 0.4
			#Cascade intensity for a fall of maxFallHeight blocks or more (1.0 = normal)
			# Default: 1.6
			# Range: 0.0 ~ 5.0
			maxIntensity = 1.6
			#Fall height (in blocks) at which a cascade reaches its maximum intensity
			# Default: 16
			# Range: 1 ~ 64
			maxFallHeight = 16
			#Multiplier for the amount of cascade foam
			# Default: 1.0
			# Range: 0.1 ~ 4.0
			foamDensity = 1.0
			#Multiplier for the size of cascade foam puffs
			# Default: 1.0
			# Range: 0.25 ~ 4.0
			puffSize = 1.0
			#Multiplier for the amount of cascade mist
			# Default: 1.0
			# Range: 0.0 ~ 2.0
			mistDensity = 1.0

		[general.advancedSettings.leafSnowSettings]
			#Chance of snow falling off a leaf block (higher = less frequent). Twice as frequent while it is snowing
			# Default: 30
			# Range: > 1
			spawnChance = 30

		[general.advancedSettings.coldBreathSettings]
			#Whether you see your own breath in first person
			firstPersonBreath = true
			#Whether mobs breathe visibly as well as players
			mobBreath = true

		[general.advancedSettings.pollenAndSporeSettings]
			#Chance for a flower to release pollen each time it is ticked (0 = never, 1 = always)
			# Default: 0.05
			# Range: 0.0 ~ 1.0
			pollenFrequency = 0.05
			#Chance for a moss block to release a spore each time it is ticked (0 = never, 1 = always)
			# Default: 0.03
			# Range: 0.0 ~ 1.0
			sporeFrequency = 0.03
			#Chance for a mushroom to release a spore each time it is ticked (0 = never, 1 = always)
			# Default: 0.2
			# Range: 0.0 ~ 1.0
			mushroomSporeFrequency = 0.2
			#Chance of a spore appearing in open air in lush caves (higher = less frequent)
			# Default: 150
			# Range: > 1
			lushCaveSporeChance = 150

		[general.advancedSettings.emberSettings]
			#Whether lit campfires and soul campfires give off embers
			campfireEmbers = true
			#Whether lit furnaces, blast furnaces and smokers spit embers
			furnaceEmbers = true
			#Multiplier for the number of embers
			# Default: 1.0
			# Range: 0.0 ~ 3.0
			emberAmount = 1.0

		[general.advancedSettings.rainbowSettings]
			#How long a rainbow stays in the sky, in seconds
			# Default: 240
			# Range: 10 ~ 3600
			rainbowDuration = 240
			#Chance for a rainbow to appear when rain stops (0 = never, 1 = always)
			# Default: 1.0
			# Range: 0.0 ~ 1.0
			rainbowChance = 1.0
			#Opacity of the rainbow
			# Default: 0.55
			# Range: 0.0 ~ 1.0
			rainbowOpacity = 0.55

		[general.advancedSettings.tumbleweedSettings]
			#Chance per tick for a tumbling bush to appear near you in a dry sandy biome
			# Default: 0.25
			# Range: 0.0 ~ 1.0
			tumbleweedFrequency = 0.25
			#Multiplier for the chance while the weather is stormy
			# Default: 4.0
			# Range: 1.0 ~ 50.0
			stormBoost = 4.0
			#Whether tumbling bushes only appear while the weather is stormy
			stormsOnly = false
			#Block tag the ground must have for tumbling bushes to appear
			groundTag = "minecraft:camel_sand_step_sound_blocks"
			#Gravity of tumbling bushes
			# Default: 0.2
			# Range: 0.0 ~ 10.0
			tumbleweedGravity = 0.2
			#How fast tumbling bushes roll
			# Default: 0.2
			# Range: 0.0 ~ 10.0
			rotationAmount = 0.2
			#How high tumbling bushes bounce off the ground
			# Default: 0.2
			# Range: 0.0 ~ 10.0
			bounciness = 0.2

		[general.advancedSettings.footstepDustSettings]
			#Whether mobs kick up dust as well as players
			mobDust = true
			#Whether dust replaces the vanilla block chips thrown up when sprinting on dusty blocks
			replaceSprintParticles = true
			#Whether dust replaces the vanilla block chips thrown up when landing from a fall on dusty blocks
			replaceLandingParticles = true
			#Blocks that produce footstep dust. Use a block id or a #tag. Example: "minecraft:gravel", "#minecraft:sand"
			dustBlocks = ["#minecraft:sand", "#minecraft:snow", "#minecraft:concrete_powder", "minecraft:gravel", "minecraft:dirt", "minecraft:grass_block", "minecraft:podzol", "minecraft:mycelium", "minecraft:coarse_dirt", "minecraft:rooted_dirt", "minecraft:farmland", "minecraft:dirt_path", "minecraft:soul_sand", "minecraft:soul_soil", "minecraft:suspicious_sand", "minecraft:suspicious_gravel"]

		[general.advancedSettings.screenShakeSettings]
			#Multiplier for the strength of all camera shake
			# Default: 1.0
			# Range: 0.0 ~ 3.0
			shakeIntensity = 1.0
			#Sounds that shake the camera. Format: "soundId|intensity|durationTicks|radius". Example: "minecraft:entity.generic.explode|0.8|12|16"
			shakeSounds = ["minecraft:entity.warden.roar|0.6|70|24", "minecraft:entity.warden.sonic_boom|1.0|15|24", "minecraft:entity.ravager.roar|0.5|25|12", "minecraft:entity.ender_dragon.growl|0.4|40|48", "minecraft:entity.generic.explode|0.8|12|16", "minecraft:entity.dragon_fireball.explode|0.5|12|16"]
