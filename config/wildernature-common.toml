#How animals behave in the world.
[Animals]
	#Termites eat logs near their mound. Also needs the mobGriefing game rule.
	enableTermiteLogEating = true
	#Beavers build dams from logs. Also needs the mobGriefing game rule.
	enableBeaverDams = true
	#Raccoons loot containers, steal eggs and nibble on crops.
	enableRaccoonStealing = true
	#Raccoons open and close doors.
	enableRaccoonDoors = true
	#Boars dig up grass while searching for food.
	enableBoarRooting = true
	#Tamed dogs dig burrows and bury bones in them.
	enableDogDigging = true
	#Trusting squirrels bring you gifts.
	enableSquirrelGifts = true
	#Angry bison charge at their target.
	enableBisonCharge = true

#Everything about the bounty board and its daily bounties.
[Bounties]
	#The bounty board can be used to take on bounties.
	enableBountyBoard = true
	#Lowest number of bounties offered each day.
	# Default: 12
	# Range: 1 ~ 32
	bountyMinDaily = 12
	#Highest number of bounties offered each day.
	# Default: 16
	# Range: 1 ~ 32
	bountyMaxDaily = 16
	#Multiplies the experience you get for bounties. 1.0 = normal, 2.0 = double, 0.0 = none.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	bountyExperienceMultiplier = 1.0

#Everything that does not fit anywhere else.
[Misc]
	#Animals show icons above their head, like alert, question mark, sleeping or hearts.
	enableEmoteParticles = true
	#Blocks show small animations and particles, like swaying contracts on the Bounty Board, dust on Termite Mounds or dripping Rotten Logs.
	animations = true
