#Which vanilla animals and natural features appear in the world. Changes need a game restart.
[World]
	#Sheep, pigs, chickens and cows no longer spawn in savannas.
	removeSavannaAnimals = true
	#Sheep, pigs, chickens and cows no longer spawn in swamps.
	removeSwampAnimals = true
	#Pigs, chickens and cows no longer spawn in jungles.
	removeJungleAnimals = true
	#Pigs and chickens no longer spawn in forests.
	removeForestAnimals = true
	#Frogs spawn in jungles.
	enableJungleFrogs = true
	#Wild hazelnut bushes generate in the world.
	enableHazelnutBushes = true
	#Termite mounds generate in savannas.
	enableTermiteMounds = true
	#Hollow caches generate in plains and forests.
	enableHollowCaches = true
	#On average one termite mound attempt in this many chunks. Higher means rarer.
	# Default: 36
	# Range: 1 ~ 1000
	termiteMoundRarity = 36
	#On average one hollow cache in this many chunks. Higher means rarer.
	# Default: 18
	# Range: 1 ~ 1000
	hollowCacheRarity = 18

#How often and in which group sizes the animals spawn. Changes need a game restart.
